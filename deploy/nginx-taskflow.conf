# Nginx reverse proxy for TaskFlow.
# Installed to /etc/nginx/sites-available/taskflow by setup_server.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;            # hide the Nginx version
    client_max_body_size 1m;      # task forms are tiny

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Forward the real client details to Flask (read by ProxyFix in the app).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Nginx serves CSS directly; no need to hit Python for static files.
    location /static/ {
        alias /opt/taskflow/app/static/;
        expires 7d;
        access_log off;
    }

    # Health check: no access logging to keep logs clean from monitoring pings.
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
