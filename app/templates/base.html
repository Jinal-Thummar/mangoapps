<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TaskFlow{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('main.index') }}">
        <span class="brand-mark">TF</span> TaskFlow
      </a>
    </div>
  </nav>

  <main class="container py-4">
    {# Flash messages (success / error notifications) #}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="container pb-4 text-center text-muted small">
    TaskFlow &middot; Flask + PostgreSQL
  </footer>
</body>
</html>
