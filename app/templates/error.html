{% extends "base.html" %}

{% block title %}Error {{ code }} - TaskFlow{% endblock %}

{% block content %}
<div class="card panel mx-auto text-center" style="max-width: 480px;">
  <div class="card-body py-5">
    <div class="display-6 fw-semibold text-muted">{{ code }}</div>
    <p class="mt-3 mb-4">{{ message }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to tasks</a>
  </div>
</div>
{% endblock %}
